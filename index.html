<!doctype html><html lang="ru"><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><link rel="manifest" href="./manifest.webmanifest"><meta name="theme-color" content="#326b54"><title>Моя форма</title><style>body{font:17px system-ui;background:#f5f4ef;color:#233a32;margin:auto;max-width:650px;padding:18px}h1{font-size:28px}section{background:white;border-radius:18px;padding:18px;margin:12px 0}button,select,input{font:inherit;padding:12px;border:1px solid #ccd5cc;border-radius:10px;margin:4px;max-width:95%}button{background:#e3eee5;color:#233a32;cursor:pointer}button.primary{background:#326b54;color:white;width:96%}nav{display:flex;flex-wrap:wrap}small{color:#58675e}#clock{font-size:48px;text-align:center;font-variant-numeric:tabular-nums}svg{width:100%;height:150px}label{display:block} .hidden{display:none}</style><h1>Моя форма</h1><nav><button onclick="show('home')">Сегодня</button><button onclick="show('progress')">Прогресс</button><button onclick="show('settings')">Настройки</button></nav><section id="home"><h2>Тренировка</h2><label>Зона <select id="zone"><option>Всё тело</option><option>Ягодицы</option><option>Руки</option><option>Живот</option><option>Талия</option><option>Растяжка</option></select></label><label>Время <select id="minutes"><option>3</option><option selected>5</option><option>10</option><option>15</option><option>20</option></select> мин</label><label>Самочувствие <select id="energy"><option>Обычное</option><option>Мало сил</option><option>Много сил</option></select></label><p><small>Начинай с мягкой разминки. Дыши свободно. При боли прекрати упражнение. Отдых можно продлить.</small></p><button class="primary" onclick="start()">Подобрать тренировку</button></section><section id="work" hidden><div id="position"></div><h2 id="ename"></h2><div id="drawing"></div><p id="desc"></p><div id="clock"></div><button class="primary" id="run" onclick="toggle()">Начать</button><div id="feedback"><button onclick="next('easy')">Легко</button><button onclick="next('ok')">В самый раз</button><button onclick="next('hard')">Тяжело</button><button onclick="next('pain')">Больно</button><button onclick="next('skip')">Пропустить</button><button onclick="next('exclude')">Исключить</button></div><button onclick="finish()">Завершить занятие</button></section><section id="progress" hidden><h2>История</h2><div id="stats"></div><h3>Замеры</h3><div id="fields"></div><button onclick="measure()">Сохранить замеры</button><div id="measurements"></div></section><section id="settings" hidden><h2>Настройки</h2><label>Отдых, секунд <input id="rest" type="number" min="5" max="120" value="5" onchange="saveSettings()"></label><label><input id="sound" type="checkbox" checked onchange="saveSettings()"> Звуковой сигнал</label><h3>Исключённые упражнения</h3><div id="excluded"></div><button onclick="backup()">Резервная копия</button><label>Восстановить копию <input type="file" accept="application/json" onchange="restore(event)"></label></section><script>
const $=id=>document.getElementById(id);const raw=`Ягодицы|Мостик|Лёжа на спине, согни колени, подними таз без прогиба поясницы.|bridge

Растяжка|Круги плечами|Медленно вращай плечами в комфортной амплитуде.|stand`;const db=raw.split('\n').map((l,i)=>{let [zone,name,desc,pose]=l.split('|');return {i,zone,name,desc,pose}});let data={history:[],measure:[],levels:{},excluded:[],rest:5,sound:true};try{Object.assign(data,JSON.parse(localStorage.getItem('moyaforma')||'{}'))}catch(e){}function save(){try{localStorage.setItem('moyaforma',JSON.stringify(data))}catch(e){alert('Не удалось сохранить данные. Сделай резервную копию.')}}let plan=[],idx=0,left=0,total=0,done=0,timer=null,phase='ready',started=0,audio;function show(id){if(plan.length&&id!=='work'&&!confirm('Завершить текущую тренировку?'))return;if(plan.length&&id!=='work')finish(false);for(let x of ['home','work','progress','settings'])$(x).hidden=x!==id;if(id==='progress')renderProgress();if(id==='settings')renderSettings()}function start(){let z=$('zone').value,m=+$('minutes').value*60,energy=$('energy').value;let pool=db.filter(e=>!data.excluded.includes(e.i)&&(z==='Всё тело'||z===e.zone));if(!pool.length)return alert('Нет доступных упражнений');let last=data.history.at(-1)?.date;let gap=last?(Date.now()-new Date(last))/86400000:0;let used=0;plan=[];let shuffled=[...pool].sort(()=>Math.random()-.5);if(z==='Всё тело'){let order=['Ягодицы','Талия','Руки','Живот','Растяжка'];shuffled=order.flatMap(k=>shuffled.filter(e=>e.zone===k).slice(0,1)).concat(shuffled)}while(used<m-8){let e=shuffled[plan.length%shuffled.length],d=Math.max(10,Math.min(45,(data.levels[e.i]||15)+(energy==='Мало сил'?-5:energy==='Много сил'?5:0)-(gap>7?5:0)));if(e.desc.includes('Сменить сторону'))d=Math.max(20,d);d=Math.min(d,m-used);if(d<10)break;plan.push({...e,d});used+=d+data.rest}idx=0;done=0;total=0;started=Date.now();$('home').hidden=true;$('work').hidden=false;load();}function load(){clearInterval(timer);timer=null;if(idx>=plan.length)return finish();phase='ready';left=plan[idx].d;let e=plan[idx];$('position').textContent=`${idx+1} / ${plan.length} · ${e.zone}`;$('ename').textContent=e.name;$('desc').textContent=e.desc;$('drawing').innerHTML=draw(e.pose);$('run').textContent='Начать';$('feedback').hidden=false;display()}function display(){$('clock').textContent=String(Math.floor(left/60)).padStart(2,'0')+':'+String(left%60).padStart(2,'0')}function beep(){if(!data.sound)return;try{audio=audio||new (window.AudioContext||window.webkitAudioContext)();audio.resume();let o=audio.createOscillator(),g=audio.createGain();o.connect(g);g.connect(audio.destination);o.frequency.value=660;g.gain.value=.12;o.start();o.stop(audio.currentTime+.22)}catch(e){}}function toggle(){if(timer){clearInterval(timer);timer=null;$('run').textContent='Продолжить';return}if(phase==='done')return;if(phase==='ready')phase='active';try{audio=audio||new(window.AudioContext||window.webkitAudioContext)();audio.resume()}catch(e){}$('run').textContent='Пауза';let deadline=Date.now()+left*1000;timer=setInterval(()=>{left=Math.max(0,Math.ceil((deadline-Date.now())/1000));display();if(phase==='active'&&plan[idx].desc.includes('Сменить сторону')&&left===Math.floor(plan[idx].d/2)&&!plan[idx].switched){plan[idx].switched=true;beep();$('desc').textContent='Смени сторону. '+plan[idx].desc}if(!left){clearInterval(timer);timer=null;beep();if(phase==='rest'){load()}else{phase='done';$('run').textContent='Оцени нагрузку'}}},150)}function next(r){if(phase==='rest')return;clearInterval(timer);timer=null;let e=plan[idx];if(['easy','ok','hard'].includes(r)){let actual=phase==='done'?e.d:phase==='active'?e.d-left:0;if(actual>0){done++;total+=actual;data.levels[e.i]=Math.max(10,Math.min(45,(data.levels[e.i]||15)+(r==='easy'?5:r==='hard'?-5:0)))}}if(r==='pain'||r==='exclude'){data.excluded.push(e.i);plan=plan.filter((x,j)=>j<=idx||x.i!==e.i)}save();idx++;if(idx>=plan.length)return finish();phase='rest';left=data.rest;$('ename').textContent='Отдых';$('desc').textContent='Далее: '+plan[idx].name;$('drawing').innerHTML='';$('feedback').hidden=true;$('run').textContent='Начать отдых';display();toggle()}function finish(render=true){clearInterval(timer);timer=null;if(done)data.history.push({date:new Date().toISOString(),zone:$('zone').value,done,seconds:total});save();plan=[];if(render){$('work').hidden=true;$('progress').hidden=false;renderProgress()}}function draw(p){let poses={stand:'M100 42 L100 95 L78 140 M100 95 L122 140 M100 55 L78 88 M100 55 L122 88',arms:'M100 42 L100 95 L78 140 M100 95 L122 140 M45 55 L155 55',front:'M100 42 L100 95 L78 140 M100 95 L122 140 M100 55 L145 65 L165 55',wall:'M70 45 L95 92 L70 140 M95 92 L90 140 M78 57 L155 55 M165 15 L165 145',squat:'M95 42 L80 90 L125 100 L125 140 M80 90 L112 100 L112 140 M90 55 L145 55',bridge:'M40 120 L65 120 L120 80 L155 110 L155 140 M120 80 L145 140',floor:'M35 120 L100 120 L140 80 L165 140 M100 120 L150 140',curl:'M45 95 L75 120 L115 120 L145 85 L165 140 M65 110 L110 95',quad:'M55 75 L130 75 L130 120 L155 120 M65 75 L65 140 M130 75 L180 75',side:'M40 110 L95 110 L155 140 M95 110 L155 75 M55 110 L70 140',sit:'M100 42 L100 105 L55 125 L100 135 L145 125 L100 105 M100 60 L65 115 M100 60 L135 115',bend:'M80 42 L105 95 L85 140 M105 95 L125 140 M90 55 L55 15 M90 55 L120 85'};let heads={stand:[100,30],arms:[100,30],front:[100,30],wall:[65,33],squat:[95,30],bridge:[30,120],floor:[25,120],curl:[35,85],quad:[43,70],side:[30,110],sit:[100,30],bend:[75,30]};let [x,y]=heads[p];return `<svg viewBox="0 0 200 155" aria-label="Условная схема положения тела"><path d="M10 145 H190" stroke="#ccd5cc"/><circle cx="${x}" cy="${y}" r="10" fill="none" stroke="#326b54" stroke-width="5"/><path d="${poses[p]}" fill="none" stroke="#326b54" stroke-width="6" stroke-linecap="round" stroke-linejoin="round"/></svg><small>Условная схема положения; ориентируйся на описание.</small>`}const fields=['Вес (кг)','Талия (см)','Живот (см)','Бёдра (см)','Рука (см)'];$('fields').innerHTML=fields.map((f,i)=>`<label>${f} <input id="m${i}" type="number" min="1" step="0.1"></label>`).join('');function measure(){let values=fields.map((f,i)=>+$('m'+i).value||null);if(values.every(v=>v===null))return;data.measure.push({date:new Date().toISOString(),values});save();renderProgress()}function renderProgress(){let week=data.history.filter(x=>Date.now()-new Date(x.date)<7*86400000);$('stats').innerHTML=`Всего занятий: ${data.history.length}<br>За 7 дней: ${Math.round(week.reduce((a,b)=>a+b.seconds,0)/60)} мин нагрузки<br>`+data.history.slice(-15).reverse().map(x=>`<p>${new Date(x.date).toLocaleDateString('ru')} · ${x.zone} · ${x.done} упражнений · ${Math.round(x.seconds/60)} мин</p>`).join('');$('measurements').innerHTML=fields.map((f,i)=>{let a=data.measure.filter(x=>x.values[i]!=null);if(!a.length)return '';let v=a.map(x=>x.values[i]),lo=Math.min(...v),hi=Math.max(...v),points=v.map((n,j)=>`${10+j*180/Math.max(1,v.length-1)},${65-(n-lo)*50/Math.max(.1,hi-lo)}`).join(' ');return `<h4>${f}: ${v.at(-1)}</h4><svg viewBox="0 0 200 75" style="height:80px"><polyline points="${points}" fill="none" stroke="#326b54" stroke-width="2"/></svg>`}).join('')}function saveSettings(){data.rest=Math.max(5,Math.min(120,+$('rest').value||5));data.sound=$('sound').checked;save()}function renderSettings(){$('rest').value=data.rest;$('sound').checked=data.sound;$('excluded').innerHTML=data.excluded.map(i=>`<p>${db[i]?.name||''} <button onclick="unexclude(${i})">Вернуть</button></p>`).join('')||'Нет'}function unexclude(i){data.excluded=data.excluded.filter(x=>x!==i);save();renderSettings()}function backup(){let a=document.createElement('a');a.href=URL.createObjectURL(new Blob([JSON.stringify(data)],{type:'application/json'}));a.download='moya-forma-backup.json';a.click();URL.revokeObjectURL(a.href)}async function restore(e){try{let d=JSON.parse(await e.target.files[0].text());if(!Array.isArray(d.history)||!Array.isArray(d.measure)||!Array.isArray(d.excluded)||!d.levels)throw Error();if(confirm('Заменить текущую историю резервной копией?')){data=d;save();renderSettings()}}catch(e){alert('Неверный файл копии')}}
</script><script>if("serviceWorker" in navigator) navigator.serviceWorker.register("./sw.js").catch(console.error);</script></html>
